[package]
name = "proxybot-core"
version = "0.1.0"
edition = "2021"
description = "Core MITM proxy engine for ProxyBot"
license = "MIT"
repository = "https://github.com/mbpz/proxybot"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

[dev-dependencies]
tempfile = "3"