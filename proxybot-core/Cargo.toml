[package]
name = "proxybot-core"
version = "0.1.0"
edition = "2021"
description = "Core MITM proxy engine for ProxyBot — no GUI/Tauri dependencies"
license = "MIT"
repository = "https://github.com/mbpz/proxybot"
keywords = ["proxy", "mitm", "https", "traffic", "classification"]
categories = ["network-programming", "development-tools"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Certificate generation (MITM)
rcgen = "0.14"
sha1 = "0.10"

# Networking
ipnetwork = "0.20"

# Logging
log = "0.4"

# Error handling
thiserror = "2"

# Async runtime (needed for future proxy engine expansion)
tokio = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
tokio-rt = ["tokio"]
