[package]
name = "proxybot-core"
version = "0.1.0"
edition = "2021"
description = "Core MITM proxy engine for ProxyBot — no GUI/Tauri dependencies"
license = "MIT"
repository = "https://github.com/mbpz/proxybot"
keywords = ["proxy", "mitm", "https", "traffic", "classification"]
categories = ["network-programming", "development-tools"]

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Certificate generation (MITM)
rcgen = "0.14"
sha1 = "0.10"

# Networking
ipnetwork = "0.20"

# Logging
log = "0.4"

# Error handling
thiserror = "2"

# Async runtime (needed for future proxy engine expansion)
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"], optional = true }

# Spec generation
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
jsonschema = { version = "0.18", default-features = false }

# Body decompression (gzip/deflate/brotli) for captured responses
flate2 = "1"
brotli = "8"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
default = ["tokio-rt"]
tokio-rt = ["tokio"]
