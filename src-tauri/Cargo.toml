[package]
name = "proxybot"
version = "0.1.0"
description = "HTTPS MITM Proxy"
authors = ["ProxyBot Contributors"]
edition = "2021"
default-run = "proxybot"
license = "MIT"
repository = "https://github.com/mbpz/proxybot"
homepage = "https://mbpz.github.io/proxybot/"

[lib]
name = "proxybot_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
thiserror = "2"

rhai = { version = "1", features = ["sync"] }

# MITM proxy dependencies
tokio = { version = "1", features = ["full"] }
nix = "0.27"
libc = "0.2"
rustls = { version = "0.23", features = ["std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
rcgen = "0.14"
log = "0.4"
rand = "0.8"
env_logger = "0.11"
time = "0.3"
# Frida's macOS devkit already contains SQLite. Linking rusqlite's bundled
# amalgamation as well produces hundreds of duplicate symbols, so use the
# platform SQLite library instead.
rusqlite = "0.32"
serde_yaml = "0.9"
notify = "8"
ipnetwork = "0.20"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
proxybot-core = { path = "../proxybot-core" }
sha1 = "0.10"
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = "0.26"
tungstenite = "0.26"
dashmap = "5"
regex = "1"
tiny_http = "0.12"
tun = "0.5"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
flate2 = "1"
libloading = "0.8"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
qrcode = "0.14"
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.6", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# Frida runtime injection (SSL bypass).
# The `auto-download` feature lets the frida-sys build script fetch the
# matching frida-core devkit (headers + static libs) on first build.
# The devkit is cached, so subsequent builds are fast.
frida = { version = "0.14", features = ["auto-download"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = "1.47.2"
rexpect = "0.7.0"
pty = "0.2.2"
cucumber = "0.23.0"
uuid = "1"

[[bin]]
name = "proxybot"
path = "src/bin/proxybot-gui.rs"

[features]
default = []
http3 = ["quinn", "h3", "h3-quinn"]
