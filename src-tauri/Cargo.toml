[package]
name = "proxybot"
version = "1.3.0"
description = "HTTPS MITM Proxy"
authors = ["ProxyBot Contributors"]
edition = "2021"
default-run = "proxybot"
license = "MIT"
repository = "https://github.com/mbpz/proxybot"
homepage = "https://mbpz.github.io/proxybot/"

[lib]
name = "proxybot_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

rhai = { version = "1", features = ["sync"] }

# MITM proxy dependencies
tokio = { version = "1", features = ["full"] }
libc = "0.2"
rustls = { version = "0.23", features = ["std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
rcgen = "0.14"
log = "0.4"
rand = "0.9"
env_logger = "0.11"
time = "0.3"
# Use the platform SQLite library rather than the bundled amalgamation.
rusqlite = "0.40"
serde_yaml = "0.9"
notify = "8"
ipnetwork = "0.21"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
proxybot-core = { path = "../proxybot-core" }
sha1 = "0.11"
base64 = "0.23"
futures-util = "0.3"
regex = "1"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
qrcode = "0.14"

[dev-dependencies]
tempfile = "3"
cucumber = "0.23.0"
uuid = "1"

[features]
default = []
