site_name: ProxyBot
site_url: https://mbpz.github.io/proxybot/
site_description: Lightweight macOS MITM traffic debugger (CLI + local web UI)

# Internal agent guides, archived historical records, one-off status snapshots,
# and the clean-room parity evidence ledger stay in the repository but are not
# part of the published user documentation site.
exclude_docs: |
  agents/
  history/
  parity/
  status/
  comparison.md
  app-classification.md
  mcp-integration.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-6
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mbpz/proxybot

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.snippets
  - tables

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          default: false
          name: 中文
          build: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Gateway Beta: gateway-beta.md
  - Status: status.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Release Checklist: release-checklist.md
  - Releasing: releasing.md
  - Licensing:
      - sing-box / GPL: legal/sing-box.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - "0002 — Explicit proxy first": adr/0002-explicit-proxy-first.md
      - "0007 — Lightweight positioning": adr/0007-lightweight-positioning.md
      - "0009 — Gateway device identity": adr/0009-gateway-device-identity.md
      - "0010 — Gateway Beta boundary": adr/0010-gateway-beta-boundary.md
      - "0011 — launchd boundary": adr/0011-launchd-gateway-boundary.md
