site_name: ProxyBot
site_url: https://mbpz.github.io/proxybot/
site_description: Lightweight macOS desktop traffic debugger for mobile app developers

# Internal agent guides, archived historical records, one-off status snapshots,
# and the clean-room parity evidence ledger stay in the repository but are not
# part of the published user documentation site.
exclude_docs: |
  agents/
  history/
  parity/
  status/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-6
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mbpz/proxybot

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.snippets
  - tables

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          default: false
          name: 中文
          build: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Product Roadmap: roadmap.md
  - Comparison: comparison.md
  - Releasing: releasing.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - "0001 — Single composition root and layering": adr/0001-single-composition-root-and-layering.md
      - "0002 — Explicit proxy first": adr/0002-explicit-proxy-first.md
      - "0003 — Capture Event and persistence ownership": adr/0003-capture-event-and-persistence-ownership.md
      - "0004 — Generated Desktop Contract": adr/0004-generated-desktop-contract.md
      - "0005 — Product tiers": adr/0005-product-tiers.md
      - "0006 — Single product version and release contract": adr/0006-single-product-version-and-release-contract.md
      - "0007 — Lightweight positioning": adr/0007-lightweight-positioning.md
      - "0008 — Rockxy clean-room parity": adr/0008-rockxy-clean-room-parity.md
  - Advanced:
      - Application Attribution: app-classification.md
      - MCP stdio Adapter: mcp-integration.md
