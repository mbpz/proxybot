version: 2
updates:
  # Rust: keep compatible minor/patch updates in one PR and isolate breaking
  # (major) updates. jsonschema is ignored deliberately: its 0.x minor bumps
  # are breaking (0.18 -> 0.49 removed the legacy JSONSchema API), so it is
  # migrated by hand instead of being bundled into routine dependency PRs.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rust-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      - dependency-name: jsonschema
        update-types:
          - major
          - minor

  # npm: majors (TypeScript/Vite/Vitest/jsdom/etc.) need a dedicated migration
  # and must never be bundled with routine minor/patch updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
