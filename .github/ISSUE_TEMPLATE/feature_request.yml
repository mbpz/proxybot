name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should ProxyBot improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable result, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
