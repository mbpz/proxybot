name: Minimal CLI CI

on:
  push:
    paths:
      - 'minimal/**'
      - '.github/workflows/minimal-ci.yml'
  pull_request:
    paths:
      - 'minimal/**'
      - '.github/workflows/minimal-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Minimal CLI tests and package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            minimal/target
          key: minimal-ci-${{ runner.os }}-${{ hashFiles('minimal/Cargo.lock') }}
          restore-keys: minimal-ci-${{ runner.os }}-

      - name: Tests
        run: cargo test --locked --manifest-path minimal/Cargo.toml

      - name: Package
        run: sh minimal/package.sh

      - name: Verify archive manifest
        run: |
          set -eu
          ARCHIVE="$(ls minimal/dist/proxybot-min-*.tar.gz | head -1)"
          tar -tzf "$ARCHIVE" | grep -qx proxybot
          tar -tzf "$ARCHIVE" | grep -qx LICENSE
          tar -tzf "$ARCHIVE" | grep -qx THIRD_PARTY.md
          tar -tzf "$ARCHIVE" | grep -qx uninstall.sh
          ! tar -tzf "$ARCHIVE" | grep -qi sing-box
          shasum -a 256 "$ARCHIVE"
