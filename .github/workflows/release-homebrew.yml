name: Release and Homebrew Update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.0). If not provided, uses the latest git tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release + Update Homebrew
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            artifact: "proxybot-tui-1.2.0-mac-arm64"
            target: "proxybot-tui"
          - runner: macos-latest
            arch: x64
            artifact: "proxybot-tui-1.2.0-mac-x64"
            target: "proxybot-tui"
          - runner: ubuntu-latest
            arch: x64
            artifact: "proxybot-tui-1.2.0-linux-x64"
            target: "proxybot-tui"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG="${VERSION:-{{ github.ref_name }}}"
          echo "tag=${TAG#v}" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Build TUI binary
        if: matrix.target == 'proxybot-tui'
        run: |
          cd src-tauri
          cargo build --release --bin proxybot-tui
          # Strip binary for smaller size
          strip target/release/proxybot-tui
          mv target/release/proxybot-tui ../${{ matrix.artifact }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-formula:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mbpz/homebrew-proxybot
          path: homebrew-tap

      - name: Get version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Compute SHA256
        run: |
          ARM_SHA=$(shasum -a 256 homebrew-tap/Formula/proxybot-tui.rb | awk '{print $1}')
          echo "sha256=$ARM_SHA" >> $GITHUB_OUTPUT
        working-directory: .

      - name: Update formula and commit
        run: |
          cd homebrew-tap
          # Replace sha256 placeholder in formula
          sed -i '' "s/TODO: compute after first release.*/sha256 \"$(shasum -a 256 Formula/proxybot-tui.rb | awk '{print $1}')\"/" Formula/proxybot-tui.rb

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "418-98282+github-actions[bot]@users.noreply.github.com"
            git add Formula/proxybot-tui.rb
            git commit -m "Update proxybot-tui to ${{ env.VERSION }}"
            git push
          fi

  homebrew-cask:
    name: Submit Homebrew Cask PR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        run: |
          TAG="${{ github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Create cask PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: Homebrew/homebrew-cask
          commit-message: "Update proxybot to ${{ env.VERSION }}"
          title: "Update proxybot to ${{ env.VERSION }}"
          body: |
            Created by `brew bump-cask-pr`.
          branch: "proxybot-${{ env.VERSION }}"
          delete-branch: true

env:
  VERSION: ${{ github.ref_name }}