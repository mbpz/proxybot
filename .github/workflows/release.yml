name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.3.0). If empty, uses git tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS App
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-latest
            arch: x64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_NAME=ProxyBot-$VERSION-mac-${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare frontend and verified bundle resources
        run: |
          pnpm resources:fetch
          pnpm build

      - name: Build macOS app bundle
        run: |
          echo "Building for ${{ matrix.arch }} on macOS"
          rustc --version
          cargo --version
          cargo build --release --locked --bin proxybot -p proxybot --features frida-runtime --target "${{ matrix.target }}"
          BIN_PATH="target/${{ matrix.target }}/release/proxybot"
          test -f "$BIN_PATH"
          echo "Using binary at: $BIN_PATH"
          # Create app bundle
          mkdir -p "ProxyBot.app/Contents/MacOS"
          mkdir -p "ProxyBot.app/Contents/Resources"
          cp "$BIN_PATH" "ProxyBot.app/Contents/MacOS/ProxyBot"
          cp src-tauri/resources/apktool.jar "ProxyBot.app/Contents/Resources/apktool.jar"
          cp -R src-tauri/resources/frida-gadget "ProxyBot.app/Contents/Resources/frida-gadget"

          # Copy icon if exists
          if [ -f icons/128x128.png ]; then
            cp icons/128x128.png "ProxyBot.app/Contents/Resources/"
          fi

          # Create Info.plist
          cat > "ProxyBot.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ProxyBot</string>
            <key>CFBundleIdentifier</key><string>com.proxybot.app</string>
            <key>CFBundleName</key><string>ProxyBot</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ env.VERSION }}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          EOF

          # Ad-hoc code sign for development/testing
          codesign --force --deep --sign - "$GITHUB_WORKSPACE/ProxyBot.app"

          # Create zip
          zip -r "$GITHUB_WORKSPACE/ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip" ProxyBot.app
          shasum -a 256 "$GITHUB_WORKSPACE/ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip"

      - name: Upload release asset
        # Only run when: (1) pushing a tag, or (2) workflow_dispatch with version input
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.version)
        uses: softprops/action-gh-release@v3
        with:
          files: ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
          draft: false
          tag_name: ${{ inputs.version || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
