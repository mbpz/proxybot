name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.3.0). If empty, uses git tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS App
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-latest
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_NAME=ProxyBot-$VERSION-mac-${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Build macOS app bundle
        run: |
          echo "Building for ${{ matrix.arch }} on macOS"
          rustc --version
          cargo --version
          # Build from workspace root - binary goes to target/release/
          cargo build --release --bin proxybot -p proxybot
          # Find the binary - it's at target/release/proxybot from workspace root
          echo "=== Checking for binary ==="
          ls -la target/release/proxybot || echo "Not at target/release/proxybot"
          ls -la src-tauri/target/release/proxybot || echo "Not at src-tauri/target/release/proxybot"
          find . -name "proxybot" -type f 2>/dev/null | head -5
          # Determine correct binary path
          if [ -f "target/release/proxybot" ]; then
            BIN_PATH="target/release/proxybot"
          elif [ -f "src-tauri/target/release/proxybot" ]; then
            BIN_PATH="src-tauri/target/release/proxybot"
          else
            echo "ERROR: proxybot binary not found"
            exit 1
          fi
          echo "Using binary at: $BIN_PATH"
          # Create app bundle
          mkdir -p "ProxyBot.app/Contents/MacOS"
          mkdir -p "ProxyBot.app/Contents/Resources"
          cp "$BIN_PATH" "ProxyBot.app/Contents/MacOS/ProxyBot"

          # Copy icon if exists
          if [ -f icons/128x128.png ]; then
            cp icons/128x128.png "ProxyBot.app/Contents/Resources/"
          fi

          # Create Info.plist
          cat > "ProxyBot.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ProxyBot</string>
            <key>CFBundleIdentifier</key><string>com.proxybot.app</string>
            <key>CFBundleName</key><string>ProxyBot</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ env.VERSION }}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          EOF

          # Create zip
          zip -r "$GITHUB_WORKSPACE/ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip" ProxyBot.app
          shasum -a 256 "$GITHUB_WORKSPACE/ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip" | awk '{print $1}'

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mbpz/homebrew-tap
          path: homebrew-tap

      - name: Get version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Get SHA256 from release
        run: |
          TAG="v${{ env.VERSION }}"
          ASSET_URL=$(curl -sL "https://api.github.com/repos/mbpz/proxybot/releases/tags/$TAG" | jq -r '.assets[] | select(.name | contains("mac-arm64")) | .browser_download_url')
          echo "Downloading from: $ASSET_URL"
          SHA=$(curl -sL "$ASSET_URL" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update Cask
        run: |
          cd homebrew-tap
          sed -i "s/sha256 arm:.*/sha256 arm:   \"${{ steps.sha.outputs.sha256 }}\",/" Casks/proxybot.rb
          sed -i "s/version \"[^\"]*\"/version \"${{ env.VERSION }}\"/" Casks/proxybot.rb
          sed -i "s|url \"https://github.com/mbpz/proxybot/releases/download/v[^\"]*| url \"https://github.com/mbpz/proxybot/releases/download/v${{ env.VERSION }}\"|" Casks/proxybot.rb

          git config user.name "github-actions[bot]"
          git config user.email "418-98282+github-actions[bot]@users.noreply.github.com"
          git add Casks/proxybot.rb
          git commit -m "Update proxybot to ${{ env.VERSION }}"
          git push

env:
  VERSION: ${{ inputs.version || github.ref_name }}