name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.3.0). If empty, uses git tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-latest
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_NAME=ProxyBot-$VERSION-mac-${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && matrix.arch == 'arm64' && 'aarch64-apple-darwin' || matrix.runner == 'macos-latest' && matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

      - name: Build macOS app bundle
        run: |
          cd src-tauri
          cargo build --release --bin proxybot
          # Create app bundle directory structure
          mkdir -p "ProxyBot.app/Contents/MacOS"
          mkdir -p "ProxyBot.app/Contents/Resources"
          cp target/release/proxybot "ProxyBot.app/Contents/MacOS/ProxyBot"

          # Copy icon if exists
          if [ -f icons/128x128.png ]; then
            cp icons/128x128.png "ProxyBot.app/Contents/Resources/"
          fi

          # Create Info.plist
          cat > "ProxyBot.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ProxyBot</string>
            <key>CFBundleIdentifier</key><string>com.proxybot.app</string>
            <key>CFBundleName</key><string>ProxyBot</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ env.VERSION }}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          EOF

          # Create zip
          cd ..
          zip -r "ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip" ProxyBot.app
          shasum -a 256 "ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip" | awk '{print $1}'

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ProxyBot-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mbpz/homebrew-tap
          path: homebrew-tap

      - name: Get version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Get SHA256 from release
        run: |
          SHA=$(curl -sL "https://api.github.com/repos/mbpz/proxybot/releases/tags/${{ env.VERSION }}" | jq -r '.assets[] | select(.name | contains("mac-arm64")) | .browser_download_url' | xargs curl -sL | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update Cask
        run: |
          cd homebrew-tap
          sed -i '' "s/sha256 arm:.*/sha256 arm:   \"${{ steps.sha.outputs.sha256 }}\",/" Casks/proxybot.rb
          sed -i '' "s/version \"[^\"]*\"/version \"${{ env.VERSION }}\"/" Casks/proxybot.rb
          sed -i '' "s|url \"https://github.com/mbpz/proxybot/releases/download/v[^\"]*/| url \"https://github.com/mbpz/proxybot/releases/download/v${{ env.VERSION }}/|" Casks/proxybot.rb

          git config user.name "github-actions[bot]"
          git config user.email "418-98282+github-actions[bot]@users.noreply.github.com"
          git add Casks/proxybot.rb
          git commit -m "Update proxybot to ${{ env.VERSION }}"
          git push

env:
  VERSION: ${{ inputs.version || github.ref_name }}